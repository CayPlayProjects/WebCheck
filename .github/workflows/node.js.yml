name: Node.js CI

on:
  push:
    branches: ["main", "upgrade/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Create standalone project archive
        if: matrix.node-version == '22.x'
        run: |
          mkdir -p /tmp/webcheck-package
          cp -R public test .github /tmp/webcheck-package/
          cp server.js security-audit.js seo-audit.js performance-audit.js accessibility-audit.js link-audit.js rate-limit.js ip-safety.js site-crawler.js lighthouse.js package.json README.md LICENSE .gitignore /tmp/webcheck-package/
          (cd /tmp/webcheck-package && zip -qr "$GITHUB_WORKSPACE/WebCheck-0.5.0.zip" .)
      - name: Upload standalone project
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: WebCheck-0.5.0
          path: WebCheck-0.5.0.zip
          retention-days: 14
